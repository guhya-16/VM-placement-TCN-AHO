# Person 3 AHO configuration
# Person 1 provides the real risk_state.csv at this input path.
algorithm=WA_AHO
input.risk_state=input/risk_state.csv

# Person 3 -> CloudSim candidate evaluation handoff
output.candidate_input=output/person3_to_cloudsim_candidate_input.csv

# CloudSim -> Person 3 candidate evaluation handoff
output.candidate_output=output/cloudsim_to_person3_candidate_output.csv

# Person 3 -> Person 2 final placement handoff
output.final_placement=output/person3_to_person2_final_placement.csv

cpu.scale=percent

# Energy power state model (ACTIVE_SERVERS_ONLY or FACILITY_ALWAYS_ON)
energy.power_state_model=ACTIVE_SERVERS_ONLY
energy.standby_power_watts=0.0

# AHO search budget.
# These are baseline development values and can be increased for final experiments.
aho.population_size=4
aho.max_iterations=50
aho.seed=20260922
aho.verbose=true

# Adaptive exploration/exploitation control.
adaptive.volatility_weight=0.60
adaptive.risk_weight=0.40
adaptive.min_exploration=0.20
adaptive.max_exploration=0.80
adaptive.mutation_base=0.10
adaptive.mutation_range=0.20

# Fitness objective weights.
fitness.energy_weight=0.40
fitness.sla_weight=0.30
fitness.active_pm_weight=0.15
fitness.mean_utilization_weight=0.00
fitness.migration_weight=0.15

# Normalization scales for comparable fitness evaluation.
# Under ACTIVE_SERVERS_ONLY, active PM energy scales between 100 Wh and 300 Wh.
fitness.energy_scale_wh=200.0
fitness.sla_scale=10.0
fitness.active_pm_scale=4.0
fitness.mean_utilization_scale=100.0
fitness.migration_scale=4.0

# SLA shortfall degradation threshold (fraction, e.g., 0.05 = 5% capacity shortfall).
sla.threshold=0.05
# Standard Hippopotamus Optimization settings
standard_ho.exploration_probability=0.50
standard_ho.mutation_probability=0.15
standard_ho.attraction_probability=0.80
standard_ho.defense_fraction=0.10